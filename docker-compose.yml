# Docker Compose for SLA Monitor System
# Complete system with frontend apps, backend API, and PostgreSQL database

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sla-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sla_monitor
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slamonitor} -d sla_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API Server
  verify-monitor-api:
    build:
      context: ./verify-monitor-api
      dockerfile: Dockerfile
    container_name: sla-monitor-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3006,http://verify-status.argosidentity.io:3000,http://verify-status.argosidentity.io:3006}
      SOCKET_CORS_ORIGINS: ${SOCKET_CORS_ORIGINS:-http://localhost:3000,http://localhost:3006,http://verify-status.argosidentity.io:3000,http://verify-status.argosidentity.io:3006}
      PORT: 3003
      HOST: 0.0.0.0
      SEED_DATABASE: ${SEED_DATABASE:-true}
    # Keep API port for direct access if needed (optional)
    ports:
      - "${API_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # System Status Dashboard (Main App)
  verify-main:
    build:
      context: ./verify-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://verify-status.argosidentity.io:3003}/api
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_API_URL:-http://verify-status.argosidentity.io:3003}
        NEXT_PUBLIC_INCIDENTS_URL: ${INCIDENTS_URL:-http://verify-status.argosidentity.io:3006}
    container_name: sla-monitor-main
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${API_URL:-http://verify-monitor-api:3003}/api
      PORT: 80
    # Direct port mapping (HAProxy 제거로 인한 복원)
    ports:
      - "${MAIN_PORT:-80}:80"
    depends_on:
      verify-monitor-api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Incident Management App
  verify-incidents:
    build:
      context: ./verify-incidents
      dockerfile: Dockerfile
    container_name: sla-monitor-incidents
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${API_URL:-http://verify-monitor-api:3003}/api
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://verify-status.argosidentity.io:3006}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT: 3006
    # Keep incidents port for direct access if needed (optional)
    ports:
      - "${INCIDENTS_PORT:-3006}:3006"
    depends_on:
      verify-monitor-api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Watch Server - Health Monitoring Service
  watch-server:
    build:
      context: ./watch-server
      dockerfile: Dockerfile
    container_name: sla-monitor-watch
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      WATCH_MODE: ${WATCH_MODE:-continuous}
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-60000}
      PORT: 3008
      API_HOST: verify-monitor-api
      API_PORT: 3003
      # Monitored service authentication
      SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY is required - health checks return 403 without it}
      SERVICE_AUTH_HEADER: ${SERVICE_AUTH_HEADER:-x-api-key}
      # Monitoring configuration
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-logs/watch-server.log}
    ports:
      - "${WATCH_PORT:-3008}:3008"
    depends_on:
      postgres:
        condition: service_healthy
      verify-monitor-api:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - watch_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  frontend:
    driver: bridge
    name: sla-monitor-frontend
  backend:
    driver: bridge
    name: sla-monitor-backend

volumes:
  postgres_data:
    driver: local
    name: sla-monitor-db-data
  watch_logs:
    driver: local
    name: sla-monitor-watch-logs